services:

  # ── Local PostgreSQL database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uabams_db
    restart: always
    environment:
      POSTGRES_DB: uabams_db
      POSTGRES_USER: uabams_user
      POSTGRES_PASSWORD: uabams_pass
    ports:
      - "5433:5432"          # expose so pgAdmin / DBeaver can connect locally
    volumes:
      # Use a named volume for the DB to avoid Windows filesystem permission errors
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uabams_user -d uabams_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI application ────────────────────────────────────────────────────
  uabams-cloud:
    build: .
    container_name: uabams_app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres is ready
    environment:
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://uabams_user:uabams_pass@postgres:5432/uabams_db
      JWT_SECRET: local-docker-change-me
      JWT_ALGORITHM: HS256
      ADMIN_RESET_KEY: local-admin-key
      GATEWAY_API_KEY_GW01: local-gw1-key
      GATEWAY_API_KEY_GW02: local-gw2-key
      OPERATOR_USERNAME: operator
      OPERATOR_PASSWORD: operator123
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      CLOUD_PUBLIC_BASE_URL: "${CLOUD_PUBLIC_BASE_URL:-http://20.8.1.15:8000}"  # changed by shobhit dated 9-9-26
      SSH_HOST: "20.8.1.15"  # changed by shobhit dated 9-9-26
      SSH_PORT: "2222"
      SSH_USER: "uabams_upload"
      SSH_HOST_KEY: "[20.8.1.15]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFQFEVhatPXMJx7b0Z0uoRqZIkS8qEDLFb8WoeI0eksr"  # changed by shobhit dated 9-9-26
      UPLOAD_BASE_DIR: "/app/incoming"
      AUTHORIZED_KEYS_PATH: "/app/sftp_keys/authorized_keys"
      TIME_DOMAIN_DIR: "/app/time_domain"
      # MSG91 SMS gateway — https://msg91.com
      MSG91_AUTH_KEY: "571412AifEc4IN9tq6aa8edfeP1"
      MSG91_SENDER_ID: "UABAMS"
      # Qikberry SMS Gateway
      QIKBERRY_AUTH_TOKEN: "${QIKBERRY_AUTH_TOKEN}"
      SMS_SENDER: "${SMS_SENDER:-IRAPNA}"
      SMS_SERVICE: "${SMS_SERVICE:-SI}"
      SMS_TEMPLATE_ID: "${SMS_TEMPLATE_ID:-1077127650088578029}"
    volumes:
      # Live code bind mount for immediate UI/API updates
      - ./app:/app/app
      # SSH authorized_keys shared with the SFTP container
      - ./uabams-data/sftp_keys:/app/sftp_keys
      # Incoming ZIP uploads landing zone
      - ./uabams-data/sftp_incoming:/app/incoming
      # Extracted time-domain sensor binary files (replaces Postgres BYTEA chunks)
      - ./uabams-data/time_domain:/app/time_domain
    restart: always

  # ── SSH/Rsync Server ────────────────────────────────────────────────────────
  rsync_ssh:
    build: ./rsync_ssh
    container_name: uabams_sftp
    ports:
      - "2222:22"
    volumes:
      # Same host dirs as the app — shared access to keys and incoming files
      - ./uabams-data/sftp_keys:/home/uabams_upload/.ssh
      - ./uabams-data/sftp_incoming:/home/uabams_upload/incoming
    restart: always

# ── No named volumes needed — all data lives on the host at ./uabams-data/ ──
volumes:
  pgdata:
