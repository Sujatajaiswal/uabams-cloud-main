services:

  # ── Local PostgreSQL database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uabams_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uabams_db}
      POSTGRES_USER: ${POSTGRES_USER:-uabams_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"          # expose so pgAdmin / DBeaver can connect locally
    volumes:
      # Use a named volume for the DB to avoid Windows filesystem permission errors
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uabams_user} -d ${POSTGRES_DB:-uabams_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI application ────────────────────────────────────────────────────
  uabams-cloud:
    build: .
    container_name: uabams_app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres is ready
    environment:
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-uabams_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uabams_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ADMIN_RESET_KEY: ${ADMIN_RESET_KEY}
      GATEWAY_API_KEY_GW01: ${GATEWAY_API_KEY_GW01}
      GATEWAY_API_KEY_GW02: ${GATEWAY_API_KEY_GW02}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CLOUD_PUBLIC_BASE_URL: "${CLOUD_PUBLIC_BASE_URL:-http://20.8.1.15:8000}"
      SSH_HOST: "${SSH_HOST:-20.8.1.15}"
      SSH_PORT: "${SSH_PORT:-2222}"
      SSH_USER: "${SSH_USER:-uabams_upload}"
      SSH_HOST_KEY: "${SSH_HOST_KEY:-[20.8.1.15]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFQFEVhatPXMJx7b0Z0uoRqZIkS8qEDLFb8WoeI0eksr}"
      UPLOAD_BASE_DIR: "/app/incoming"
      AUTHORIZED_KEYS_PATH: "/app/sftp_keys/authorized_keys"
      TIME_DOMAIN_DIR: "/app/time_domain"
      # MSG91 SMS gateway — https://msg91.com
      MSG91_AUTH_KEY: "${MSG91_AUTH_KEY}"
      MSG91_SENDER_ID: "${MSG91_SENDER_ID:-UABAMS}"
      # Qikberry SMS Gateway
      QIKBERRY_AUTH_TOKEN: "${QIKBERRY_AUTH_TOKEN}"
      SMS_SENDER: "${SMS_SENDER:-IRAPNA}"
      SMS_SERVICE: "${SMS_SERVICE:-SI}"
      SMS_TEMPLATE_ID: "${SMS_TEMPLATE_ID:-1077127650088578029}"
    volumes:
      # Live code bind mount for immediate UI/API updates
      - ./app:/app/app
      # SSH authorized_keys shared with the SFTP container
      - ./uabams-data/sftp_keys:/app/sftp_keys
      # Incoming ZIP uploads landing zone
      - ./uabams-data/sftp_incoming:/app/incoming
      # Extracted time-domain sensor binary files (replaces Postgres BYTEA chunks)
      - ./uabams-data/time_domain:/app/time_domain
    restart: always

  # ── SSH/Rsync Server ────────────────────────────────────────────────────────
  rsync_ssh:
    build: ./rsync_ssh
    container_name: uabams_sftp
    ports:
      - "2222:22"
    volumes:
      # Same host dirs as the app — shared access to keys and incoming files
      - ./uabams-data/sftp_keys:/home/uabams_upload/.ssh
      - ./uabams-data/sftp_incoming:/home/uabams_upload/incoming
    restart: always

  # ── Nginx HTTPS Reverse Proxy (Port 443 / Port 80) ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: uabams_nginx
    restart: always
    ports:
      - "80:80"       # HTTP (redirects to HTTPS)
      - "443:443"     # HTTPS (SSL Termination)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - uabams-cloud

# ── No named volumes needed — all data lives on the host at ./uabams-data/ ──
volumes:
  pgdata:
